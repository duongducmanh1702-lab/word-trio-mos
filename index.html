<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Trio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
:root{
  --paper:#F3F6FB;
  --sheet:#FFFFFF;
  --ink:#141C33;
  --ink-2:#465170;
  --ink-3:#7D88A3;
  --rule:#DBE2EE;
  --rule-2:#C5CFE0;
  --accent:#2D5BE3;
  --accent-soft:#E2E9FD;
  --on-accent:#FFFFFF;
  --good:#138A4E;
  --good-soft:#D9F4E5;
  --bad:#D93A42;
  --bad-soft:#FDE2E3;
  --marker:rgba(255,205,40,.78);
  --tile:#FFFFFF;
  --tile-edge:#C3CEE3;
  --shadow:rgba(30,50,110,.14);
  --lv-easy:#16A05A;
  --lv-medium:#2D5BE3;
  --lv-hard:#EC5B24;
  --serif:"Alegreya", "Iowan Old Style", Georgia, serif;
  --sans:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0F1422;
    --sheet:#182033;
    --ink:#EEF2FB;
    --ink-2:#B0BAD0;
    --ink-3:#7A86A2;
    --rule:#26304A;
    --rule-2:#34405E;
    --accent:#7F9CFF;
    --accent-soft:#1E2A4D;
    --on-accent:#0F1422;
    --good:#43D68E;
    --good-soft:#15352A;
    --bad:#FF6F74;
    --bad-soft:#3D1D24;
    --marker:rgba(255,200,40,.42);
    --tile:#1C2640;
    --tile-edge:#34405E;
    --shadow:rgba(0,0,0,.45);
    --lv-easy:#43D68E;
    --lv-medium:#7F9CFF;
    --lv-hard:#FF9254;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0F1422;
  --sheet:#182033;
  --ink:#EEF2FB;
  --ink-2:#B0BAD0;
  --ink-3:#7A86A2;
  --rule:#26304A;
  --rule-2:#34405E;
  --accent:#7F9CFF;
  --accent-soft:#1E2A4D;
  --on-accent:#0F1422;
  --good:#43D68E;
  --good-soft:#15352A;
  --bad:#FF6F74;
  --bad-soft:#3D1D24;
  --marker:rgba(255,200,40,.42);
  --tile:#1C2640;
  --tile-edge:#34405E;
  --shadow:rgba(0,0,0,.45);
  --lv-easy:#43D68E;
  --lv-medium:#7F9CFF;
  --lv-hard:#FF9254;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:17px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-inline:16px;
}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:28px}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{display:flex;align-items:baseline;gap:8px;background:none;border:0;padding:0;cursor:pointer}
.mark-word{font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:-.01em}
.mark-dots{display:inline-flex;gap:3px;transform:translateY(-3px)}
.mark-dots i{width:7px;height:7px;border-radius:50%;background:var(--lv-easy)}
.mark-dots i:nth-child(2){background:var(--lv-medium)}
.mark-dots i:nth-child(3){background:var(--lv-hard)}
.tools{display:flex;gap:4px;align-items:center}
.tool{
  height:34px;min-width:34px;padding:0 9px;border-radius:8px;border:1px solid transparent;
  background:none;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-size:14px;font-weight:700;letter-spacing:.04em
}
.tool:hover{background:var(--sheet);border-color:var(--rule)}
.tool svg{width:18px;height:18px}

/* ---------- account ---------- */
.acct{gap:8px;padding:0 12px 0 10px;border-color:var(--rule);background:var(--sheet);color:var(--ink);font-weight:700;letter-spacing:0;font-size:14.5px}
.acct:hover{border-color:var(--accent)}
.acct .g{width:16px;height:16px}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.acct.in{padding:0 4px;border-radius:999px;min-width:34px}
.acct.in .acct-label{display:none}
.sync{margin:-14px 0 0;font-size:14.5px;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.sync.on .dot{background:var(--good)}
.sync button{background:none;border:0;padding:0;color:var(--accent);font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.acct-head{display:flex;gap:14px;align-items:center}
.acct-head .avatar{width:48px;height:48px;font-size:20px}
.acct-name{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.15}
.acct-mail{color:var(--ink-3);font-size:15px;word-break:break-all}

/* ---------- home ---------- */
.intro{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.intro h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,6vw,46px);line-height:1.08;margin:0;letter-spacing:-.015em;text-wrap:balance}
.intro h1 em{font-style:normal;padding:0 .08em;background:linear-gradient(transparent 56%, var(--marker) 56%, var(--marker) 92%, transparent 92%)}
.intro p{margin:0;color:var(--ink-2);max-width:52ch}

.sample{
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding-block:14px;display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:6px;
  font-family:var(--serif);font-size:18px;color:var(--ink-2)
}
.sample .n{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--ink-3);padding-top:4px;font-variant-numeric:tabular-nums}
.sample .hl{color:var(--ink);background:linear-gradient(transparent 52%, var(--marker) 52%, var(--marker) 92%, transparent 92%);padding:0 2px}

.section-label{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0}
.levels{display:flex;flex-direction:column}
.level{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 16px;
  padding:18px 4px;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;cursor:pointer;width:100%
}
.levels .level:first-child{border-top:1px solid var(--rule)}
.level:hover .level-name{color:var(--lv)}
.level:hover{background:linear-gradient(90deg, color-mix(in srgb, var(--lv) 8%, transparent), transparent 70%)}
.level-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.level-name{font-family:var(--serif);font-size:26px;font-weight:500;line-height:1.1;transition:color .15s}
.cefr{font-size:12.5px;font-weight:800;letter-spacing:.06em;color:var(--on-accent);background:var(--lv);padding:1px 8px;border-radius:999px;transform:translateY(-3px)}
.level-desc{grid-column:1;color:var(--ink-2);font-size:15.5px}
.level-count{grid-row:1 / span 2;grid-column:2;text-align:right;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.level-count b{font-size:20px;font-weight:700}
.level-count span{color:var(--ink-3);font-size:14px}
.meter{grid-column:1 / -1;height:5px;background:var(--rule);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--lv);border-radius:2px;min-width:5px}
.level-count .level-cta{font-size:14px;font-weight:800;color:var(--lv)}

.notebook-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  padding:16px 18px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);box-shadow:0 8px 20px -14px var(--shadow);cursor:pointer;text-align:left
}
.notebook-row:hover{border-color:var(--accent)}
.notebook-row svg{color:var(--accent)}
.notebook-row strong{font-family:var(--serif);font-size:20px;font-weight:500;display:block}
.notebook-row span{color:var(--ink-2);font-size:15px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--ink-3);font-size:14.5px;border-top:1px solid var(--rule);padding-top:16px}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;font-size:14.5px}
.linkbtn:hover{color:var(--bad)}

/* ---------- play ---------- */
.play-head{display:flex;flex-direction:column;gap:10px}
.play-meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.back{background:none;border:0;padding:0;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:500}
.back:hover{color:var(--ink)}
.back svg{width:16px;height:16px}
.qno{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:15px}
.qno b{color:var(--ink);font-weight:700}
.track{height:5px;background:var(--rule);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;background:var(--lv, var(--accent));transition:width .4s ease}

.prompt{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--lv, var(--accent));margin:0}
.contexts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.contexts li{
  display:grid;grid-template-columns:28px 1fr;gap:10px;padding-block:14px;border-bottom:1px solid var(--rule);
  font-family:var(--serif);font-size:clamp(19px,2.6vw,22px);line-height:1.5
}
.contexts li:first-child{border-top:1px solid var(--rule)}
.contexts .n{font-family:var(--sans);font-size:13px;font-weight:800;color:var(--on-accent);background:var(--lv, var(--accent));width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:6px;font-variant-numeric:tabular-nums}
.blank{
  display:inline-block;min-width:calc(var(--len) * .72em + .6em);padding:0 .15em;margin:0 .1em;
  border:0;border-bottom:2.5px solid var(--lv, var(--accent));background:none;font:inherit;line-height:1.15;
  text-align:center;letter-spacing:.06em;color:var(--ink-2);cursor:default;vertical-align:baseline
}
.blank.filled{color:var(--lv, var(--accent));font-weight:700}
.blank.solved{
  border-bottom-color:transparent;color:var(--ink);cursor:pointer;letter-spacing:0;font-weight:500;min-width:0;padding:0 .12em;
  background:linear-gradient(transparent 50%, var(--marker) 50%, var(--marker) 94%, transparent 94%);
  background-size:0% 100%;background-repeat:no-repeat;animation:mark .5s ease forwards
}
.contexts li:nth-child(2) .blank.solved{animation-delay:.12s}
.contexts li:nth-child(3) .blank.solved{animation-delay:.24s}
.blank.solved:hover{text-decoration:underline dotted;text-underline-offset:4px}
@keyframes mark{to{background-size:100% 100%}}

.answer{display:flex;align-items:center;justify-content:center;gap:10px}
.slots{flex-wrap:nowrap!important}
.slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.slot{
  width:min(44px, calc((100vw - 150px) / var(--n) - 6px));height:52px;border-radius:6px;border:1.5px solid var(--rule-2);background:var(--sheet);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;text-transform:uppercase;
  transition:border-color .15s, background .15s
}
.slot.next{border-color:var(--lv, var(--accent));box-shadow:0 0 0 3px color-mix(in srgb, var(--lv, var(--accent)) 18%, transparent)}
.slot.hint{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.slot.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.slot.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.shake{animation:shake .32s ease}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.round{
  width:40px;height:40px;border-radius:50%;border:1px solid var(--rule-2);background:var(--sheet);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none
}
.round:hover:not(:disabled){color:var(--ink);border-color:var(--ink-3)}
.round:disabled{opacity:.4;cursor:default}
.round svg{width:18px;height:18px}

.status{min-height:24px;text-align:center;font-size:16px;color:var(--ink-2);margin:0}
.status.ok{color:var(--good);font-weight:700}
.status.no{color:var(--bad);font-weight:700}
.status.hint{color:var(--accent);font-weight:700}

.tiles{display:grid;grid-template-columns:repeat(8, 1fr);gap:8px;max-width:520px;margin:0 auto;width:100%}
.tile{
  aspect-ratio:1/1.08;max-width:100%;border-radius:7px;border:1px solid var(--tile-edge);background:var(--tile);
  box-shadow:0 3px 0 var(--tile-edge), 0 8px 14px -8px var(--shadow);color:var(--ink);
  font-weight:800;font-size:clamp(18px,4.6vw,23px);cursor:pointer;transition:transform .08s, opacity .15s;
  display:flex;align-items:center;justify-content:center;user-select:none
}
.tile:hover:not(:disabled){transform:translateY(-1px);border-color:var(--lv, var(--accent));color:var(--lv, var(--accent))}
.tile:active:not(:disabled){transform:translateY(2px);box-shadow:0 0 0 var(--tile-edge)}
.tile:disabled{opacity:.18;cursor:default;box-shadow:none}
.kbd-hint{text-align:center;color:var(--ink-3);font-size:14px;margin:-8px 0 0}
.kbd-hint kbd{font-family:var(--sans);font-size:12.5px;border:1px solid var(--rule-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--sheet)}

.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{
  height:46px;padding:0 22px;border-radius:8px;border:1px solid var(--rule-2);background:var(--sheet);
  font-weight:700;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px
}
.btn:hover:not(:disabled){border-color:var(--ink-3)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);box-shadow:0 8px 18px -10px var(--accent);color:var(--on-accent);min-width:150px;justify-content:center}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn.quiet{border-color:transparent;background:none;color:var(--ink-2)}
.btn.quiet:hover:not(:disabled){color:var(--ink);border-color:transparent;text-decoration:underline;text-underline-offset:3px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}

/* ---------- done ---------- */
.done{display:flex;flex-direction:column;gap:14px;align-items:flex-start;padding-top:24px}
.done h2{font-family:var(--serif);font-size:36px;font-weight:500;margin:0;line-height:1.1;text-wrap:balance}
.done p{margin:0;color:var(--ink-2);max-width:50ch}

/* ---------- notebook ---------- */
.nb-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.nb-item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding-block:16px;border-bottom:1px solid var(--rule)}
.nb-item:first-child{border-top:1px solid var(--rule)}
.nb-word{font-family:var(--serif);font-size:22px;font-weight:700;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.nb-word small{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink-3)}
.nb-mean{grid-column:1;color:var(--ink)}
.nb-ctx{grid-column:1;color:var(--ink-2);font-family:var(--serif);font-style:italic;font-size:16.5px}
.nb-ctx b{font-style:normal;font-weight:500;background:linear-gradient(transparent 55%, var(--marker) 55%)}
.nb-item .round{grid-row:1 / span 3;grid-column:2;align-self:start}
.empty{color:var(--ink-2);padding:28px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.empty strong{display:block;font-family:var(--serif);font-size:22px;font-weight:500;color:var(--ink);margin-bottom:4px}
.pos{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:999px;align-self:flex-start}

/* ---------- dialogs ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,26,25,.38);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px))}
@media (min-width:640px){.scrim{align-items:center}}
.dialog{
  width:100%;max-width:460px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;
  padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 50px -20px rgba(0,0,0,.4);
  max-height:calc(100vh - 32px);overflow:auto
}
.dialog h3{font-family:var(--serif);font-size:24px;font-weight:500;margin:0}
.dialog p{margin:0;color:var(--ink-2)}
.dlg-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dlg-word{font-family:var(--serif);font-size:34px;font-weight:700;line-height:1.05}
.dlg-ipa{color:var(--ink-3);font-size:16px;margin-top:4px}
.dlg-mean{font-size:18px;color:var(--ink);margin:0}
.dlg-other{font-size:15px;color:var(--ink-3)}
.dlg-ctx{font-family:var(--serif);font-style:italic;color:var(--ink-2);border-left:2px solid var(--rule-2);padding-left:12px;margin:0}
.dlg-ctx b{font-style:normal;font-weight:500;background:linear-gradient(transparent 55%, var(--marker) 55%)}
.senses{display:flex;gap:6px;flex-wrap:wrap}
.sense-tab{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--rule-2);background:none;cursor:pointer;font-size:14px;font-weight:700;color:var(--ink-2)}
.sense-tab[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.star.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.star.on svg path{fill:currentColor}
.dlg-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}

@media (max-width:520px){
  body{font-size:16px}
  .tiles{grid-template-columns:repeat(7, 1fr);gap:6px}
  .slot{height:46px;font-size:21px}
  .level-name{font-size:23px}
  .answer .round{width:36px;height:36px}
}
@media (max-width:380px){
  .slot{height:42px;font-size:19px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}
}
</style>

<div class="wrap">
  <header class="bar">
    <button class="mark" id="btn-home-mark" type="button" aria-label="Word Trio">
      <span class="mark-word">Word Trio</span>
      <span class="mark-dots" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <div class="tools">
      <button class="tool acct" id="btn-acct" type="button" hidden></button>
      <button class="tool" id="btn-lang" type="button">VI</button>
      <button class="tool" id="btn-sound" type="button"></button>
      <button class="tool" id="btn-theme" type="button"></button>
    </div>
  </header>

  <!-- HOME -->
  <main id="v-home" style="display:flex;flex-direction:column;gap:28px">
    <section class="intro">
      <h1 id="t-title"></h1>
      <p id="t-lede"></p>
    </section>

    <div class="sample" aria-hidden="true">
      <span class="n">1</span><span id="s1"></span>
      <span class="n">2</span><span id="s2"></span>
      <span class="n">3</span><span id="s3"></span>
    </div>

    <section style="display:flex;flex-direction:column;gap:12px">
      <h2 class="section-label" id="t-choose"></h2>
      <div class="levels" id="levels"></div>
    </section>

    <button class="notebook-row" id="btn-notebook" type="button">
      <span><strong id="t-notebook"></strong><span id="nb-count"></span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <p class="sync" id="sync-note" hidden></p>

    <div class="foot">
      <span id="t-foot"></span>
      <button class="linkbtn" id="btn-reset" type="button"></button>
    </div>
  </main>

  <!-- PLAY -->
  <main id="v-play" hidden style="display:flex;flex-direction:column;gap:24px">
    <div class="play-head">

function initialOf(u){ return ((u.displayName || u.email || "?").trim()[0] || "?").toUpperCase(); }
function avatarHTML(u){
  return u.photoURL ? '<img src="' + esc(u.photoURL) + '" alt="" referrerpolicy="no-referrer">' : esc(initialOf(u));
}
function pushCloud(){
  if(!cloud.on || !cloud.user || cloud.loading) return;
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(function(){
    cloud.db.collection("users").doc(cloud.user.uid).set({
      progress:progress, saved:saved,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    }, { merge:true }).catch(function(e){ console.warn("sync", e); });
  }, 500);
}
function mergeFromCloud(data){
  data = data || {};
  var cp = data.progress || {}, cs = Array.isArray(data.saved) ? data.saved : [];
  ORDER.forEach(function(k){ progress[k] = Math.max(progress[k] || 0, cp[k] || 0); });
  var merged = cs.slice();
  saved.forEach(function(id){ if(merged.indexOf(id) === -1) merged.push(id); });
  saved = merged;
}
function refreshView(){
  renderAccount();
  if(view === "v-home") renderHome();
  if(view === "v-notebook") renderNotebook();
}
function renderAccount(){
  var b = $("btn-acct"), note = $("sync-note");
  if(!cloud.on){ b.hidden = true; note.hidden = true; return; }
  b.hidden = false; note.hidden = false;
  if(cloud.user){
    b.className = "tool acct in";
    b.innerHTML = '<span class="avatar">' + avatarHTML(cloud.user) + '</span><span class="acct-label"></span>';
    b.setAttribute("aria-label", cloud.user.displayName || cloud.user.email || ""); b.title = cloud.user.email || "";
    note.className = "sync on";
    note.innerHTML = '<span class="dot"></span><span>' + esc(T("syncOn")) + '</span>';
  } else {
    b.className = "tool acct";
    b.innerHTML = G_ICON + '<span class="acct-label">' + esc(T("signIn")) + '</span>';
    b.setAttribute("aria-label", T("signInG")); b.title = T("signInG");
    note.className = "sync";
    note.innerHTML = '<span class="dot"></span><span>' + esc(T("syncOff")) + '</span><button type="button" id="btn-sync-in">' + esc(T("signInG")) + '</button>';
    $("btn-sync-in").addEventListener("click", signIn);
  }
  if(!$("dlg-acct").hidden) paintAcct();
}
function signIn(){
  if(!cloud.on) return;
  var provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt:"select_account" });
  cloud.auth.signInWithPopup(provider).catch(function(e){
    if(e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")){
      cloud.auth.signInWithRedirect(provider); return;
    }
    if(e && e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request"){
      setHomeNote(T("signInFail"));
    }
  });
}
function setHomeNote(msg){ var n = $("sync-note"); n.hidden = false; n.className = "sync"; n.innerHTML = '<span class="dot"></span><span>' + esc(msg) + '</span>'; }
function paintAcct(){
  var u = cloud.user; if(!u) return;
  $("a-avatar").innerHTML = avatarHTML(u);
  $("a-name").textContent = u.displayName || "";
  $("a-mail").textContent = u.email || "";
  $("a-text").textContent = T("acctText");
  $("btn-a-out").textContent = T("signOut");
  $("btn-a-close").textContent = T("close");
}
function openAcct(){
  if(!cloud.user){ signIn(); return; }
  paintAcct(); $("dlg-acct").hidden = false; $("btn-a-close").focus();
}
function signOut(){
  $("dlg-acct").hidden = true;
  cloud.auth.signOut().then(function(){
    progress = { easy:0, medium:0, hard:0 }; saved = [];
    try { localStorage.removeItem("wt2.progress"); localStorage.removeItem("wt2.saved"); } catch(e){}
    if(view !== "v-home" && view !== "v-notebook"){ renderHome(); show("v-home"); }
    refreshView();
  });
}
function initCloud(){
  if(!FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey || !window.firebase) return;
  try {
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    cloud.auth = firebase.auth(); cloud.db = firebase.firestore(); cloud.on = true;
  } catch(e){ console.warn("firebase", e); return; }
  cloud.auth.getRedirectResult().catch(function(){});
  cloud.auth.onAuthStateChanged(function(u){
    cloud.user = u;
    if(!u){ refreshView(); return; }
    cloud.loading = true;
    cloud.db.collection("users").doc(u.uid).get().then(function(snap){
      mergeFromCloud(snap.exists ? snap.data() : null);
    }).catch(function(e){ console.warn("load", e); }).then(function(){
      cloud.loading = false;
      try { localStorage.setItem("wt2.progress", JSON.stringify(progress)); localStorage.setItem("wt2.saved", JSON.stringify(saved)); } catch(e){}
      pushCloud();
      refreshView();
    });
  });
}

var ctx = null;
function tone(f, d, type, vol, delay){
  if(!prefs.sound) return;
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if(ctx.state === "suspended") ctx.resume();
    var t0 = ctx.currentTime + (delay || 0);
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.06, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0 + d + 0.02);
  } catch(e){}
}

  no:function(){ tone(220, .18, "triangle", .06); tone(196, .22, "triangle", .05, .1); },
  hint:function(){ tone(700, .12, "triangle", .05); },

/* ---------- play ---------- */
var FILL = "AAABBCCDDEEEEFFGGHHIIIKLLLMMNNNOOOPPRRRSSSTTTUUVWY";
var st = null;

function startLevel(k, restart){
  if(restart || (progress[k] || 0) >= LEVELS[k].q.length){ progress[k] = 0; save("wt2.progress", progress); }
  st = { level:k, i:progress[k] || 0 };
  document.body.style.setProperty("--lv", "var(--lv-" + k + ")");
  show("v-play");
  renderPuzzle();
}

function shuffle(a){
  for(var j = a.length - 1; j > 0; j--){ var r = Math.floor(Math.random() * (j + 1)); var x = a[j]; a[j] = a[r]; a[r] = x; }
  return a;
}
function bankFor(word){
  var size = window.innerWidth <= 520 ? 14 : 16;
  var letters = word.toUpperCase().split("");
  while(letters.length < size) letters.push(FILL[Math.floor(Math.random() * FILL.length)]);
  return shuffle(letters);
}

function puzzle(){ return LEVELS[st.level].q[st.i]; }

function renderPuzzle(){
  var L = LEVELS[st.level], p = puzzle(), n = p.answer.length;
  st.slots = new Array(n).fill(null);  // {ch, tile} or {ch, hint:true}
  st.bank = bankFor(p.answer);
  st.used = st.bank.map(function(){ return false; });
  st.hint = 0; st.solved = false; st.locked = false;

  $("play-level").textContent = lvName(st.level);
  $("qno").innerHTML = T("q")(st.i + 1, L.q.length);
  $("track").style.width = (st.i / L.q.length * 100) + "%";
  $("t-prompt").textContent = T("prompt");
  $("t-kbd").innerHTML = T("kbd");
  $("btn-skip").textContent = T("skip");
  $("btn-clear").textContent = T("clear");
  $("btn-del").setAttribute("aria-label", T("del")); $("btn-del").title = T("del");

  var ol = $("contexts"); ol.innerHTML = "";
  p.sentences.forEach(function(s, idx){
    var li = document.createElement("li");
    var parts = s.split("___");
    var num = document.createElement("span"); num.className = "n"; num.textContent = idx + 1;
    var txt = document.createElement("span");
    txt.appendChild(document.createTextNode(parts[0]));
    var bl = document.createElement("button");
    bl.type = "button"; bl.className = "blank"; bl.tabIndex = -1;
    bl.style.setProperty("--len", n);
    bl.addEventListener("click", function(){ if(st.solved) openWord(st.level, st.i, idx); });
    txt.appendChild(bl);
    txt.appendChild(document.createTextNode(parts[1] || ""));
    li.appendChild(num); li.appendChild(txt);
    ol.appendChild(li);
  });

  var sl = $("slots"); sl.innerHTML = ""; sl.style.setProperty("--n", n);
  for(var i = 0; i < n; i++){ var d = document.createElement("div"); d.className = "slot"; sl.appendChild(d); }

  var tg = $("tiles"); tg.innerHTML = "";
  tg.style.gridTemplateColumns = "repeat(" + (st.bank.length / 2) + ", 1fr)";
  st.bank.forEach(function(ch, idx){
    var b = document.createElement("button");
    b.type = "button"; b.className = "tile"; b.textContent = ch;
    b.addEventListener("click", function(){ pressTile(idx); });
    tg.appendChild(b);
  });

  setStatus("", "");
  paint();
}

function setStatus(text, cls){ var s = $("status"); s.textContent = text; s.className = "status" + (cls ? " " + cls : ""); }

function paint(cls){
  var p = puzzle();
  var slots = $("slots").children;
  var firstEmpty = st.slots.indexOf(null);
  var word = "";
  for(var i = 0; i < st.slots.length; i++){
    var v = st.slots[i], el = slots[i];
    el.textContent = v ? v.ch : "";
    el.className = "slot" + (v && v.hint ? " hint" : "") + (!st.locked && i === firstEmpty ? " next" : "") + (cls ? " " + cls : "");
    word += v ? v.ch.toLowerCase() : " ";
  }
  var tiles = $("tiles").children;
  for(var j = 0; j < tiles.length; j++) tiles[j].disabled = st.used[j] || st.locked;

  var blanks = $("contexts").querySelectorAll(".blank");
  blanks.forEach(function(b){
    if(st.solved){ b.textContent = p.answer; b.className = "blank solved"; b.tabIndex = 0; b.setAttribute("aria-label", p.answer); }
    else { b.textContent = word.replace(/ +$/, ""); b.className = "blank" + (word.trim() ? " filled" : ""); }
  });

  var full = firstEmpty === -1;
  var go = $("btn-go");
  if(st.solved){ go.textContent = T("next"); go.disabled = false; }
  else { go.textContent = T("check"); go.disabled = !full || st.locked; }
  $("btn-del").disabled = st.locked || !st.slots.some(function(v){ return v && !v.hint; });
  $("btn-clear").hidden = st.solved;
  $("btn-skip").hidden = st.solved;
  var hb = $("btn-hint");
  hb.disabled = st.solved || st.locked;
  var hl = T("hintLabel")[Math.min(st.hint, 3)];
  hb.setAttribute("aria-label", hl); hb.title = hl;
}

function pressTile(idx){
  if(st.locked || st.used[idx]) return;
  var pos = st.slots.indexOf(null);
  if(pos === -1) return;
  st.slots[pos] = { ch:st.bank[idx], tile:idx };
  st.used[idx] = true;
  sfx.tap();
  if(view === "v-play" && $("status").className.indexOf("no") > -1) setStatus("", "");
  paint();
}
function typeLetter(ch){
  if(st.locked) return;
  for(var i = 0; i < st.bank.length; i++){
    if(!st.used[i] && st.bank[i] === ch){ pressTile(i); return; }
  }
  var tiles = $("tiles"); tiles.classList.remove("shake"); void tiles.offsetWidth; tiles.classList.add("shake");
}
function deleteLast(){
  if(st.locked) return;
  for(var i = st.slots.length - 1; i >= 0; i--){
    var v = st.slots[i];
    if(v && !v.hint){ st.used[v.tile] = false; st.slots[i] = null; sfx.tap(); paint(); return; }
  }
}
function clearAll(){
  if(st.locked) return;
  st.slots = st.slots.map(function(v){ if(v && !v.hint){ st.used[v.tile] = false; return null; } return v; });
  setStatus("", ""); paint();
}
function placeHint(pos){
  var p = puzzle(), v = st.slots[pos];
  if(v && !v.hint) st.used[v.tile] = false;
  var ch = p.answer[pos].toUpperCase();
  // consume a matching tile so the bank stays honest
  for(var i = 0; i < st.bank.length; i++){
    if(!st.used[i] && st.bank[i] === ch){ st.used[i] = true; break; }
  }
  st.slots[pos] = { ch:ch, hint:true };
}
function useHint(){
  if(st.solved || st.locked) return;
  var p = puzzle(), n = p.answer.length;
  if(st.hint === 0){ placeHint(0); st.hint = 1; setStatus(T("h1"), "hint"); }
  else if(st.hint === 1){ placeHint(n - 1); st.hint = 2; setStatus(T("h2"), "hint"); }
  else if(st.hint === 2){
    for(var i = 0; i < n; i++){ if(!st.slots[i] || !st.slots[i].hint) placeHint(i); }
    st.hint = 3; solve(true); return;
  }
  sfx.hint(); paint();
}
function solve(viaHint){
  var p = puzzle();
  st.solved = true; st.locked = true;
  progress[st.level] = Math.max(progress[st.level] || 0, st.i + 1);
  save("wt2.progress", progress);
  $("track").style.width = ((st.i + 1) / LEVELS[st.level].q.length * 100) + "%";
  if(viaHint){ sfx.hint(); paint(); setStatus(T("h3"), "hint"); }
  else { sfx.ok(); paint("ok"); setStatus(T("ok")(p.answer), "ok"); }
}
function check(){
  if(st.locked || st.solved || st.slots.indexOf(null) !== -1) return;
  var guess = st.slots.map(function(v){ return v.ch; }).join("").toLowerCase();
  if(guess === puzzle().answer.toLowerCase()){ solve(false); return; }
  st.locked = true;
  sfx.no(); paint("no"); setStatus(T("no"), "no");
  var sl = $("slots"); sl.classList.remove("shake"); void sl.offsetWidth; sl.classList.add("shake");
  setTimeout(function(){
    st.locked = false;
    st.slots = st.slots.map(function(v){ if(v && !v.hint){ st.used[v.tile] = false; return null; } return v; });
    paint();
  }, 700);
}
function next(){
  var L = LEVELS[st.level];
  if(st.i + 1 >= L.q.length){ showDone(); return; }
  st.i += 1; renderPuzzle();
  window.scrollTo({ top:0, behavior:"smooth" });
}
function skip(){
  if(st.solved) return;
  progress[st.level] = Math.max(progress[st.level] || 0, st.i + 1);
  save("wt2.progress", progress);
  next();
}
function goPrimary(){ if(st.solved) next(); else check(); }

/* ---------- done ---------- */
function showDone(){
  var L = LEVELS[st.level];
  $("done-level").textContent = lvName(st.level) + " · " + L.cefr;
  $("done-title").textContent = T("doneTitle")(L.q.length);
  $("done-sub").textContent = T("doneSub");
  $("btn-replay").textContent = T("replay");
  $("btn-other").textContent = T("other");
  show("v-done");
}

/* ---------- word dialog ---------- */
var dlg = null;
function idOf(k, i, s){ return k + ":" + i + ":" + s; }
function isSaved(id){ return saved.indexOf(id) > -1; }
function ctxHTML(p, s){
  var parts = p.sentences[s].split("___");
  return esc(parts[0]) + "<b>" + esc(p.answer) + "</b>" + esc(parts[1] || "");
}
function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function openWord(k, i, s){
  dlg = { k:k, i:i, s:s };
  $("dlg-word").hidden = false;
  paintWord();
  $("btn-w-close").focus();
}
function paintWord(){
  var p = LEVELS[dlg.k].q[dlg.i], sense = p.senses[dlg.s];
  $("w-word").textContent = p.answer;
  $("w-ipa").textContent = sense.ipa;
  var tabs = $("w-senses"); tabs.innerHTML = "";
  p.senses.forEach(function(se, idx){
    var b = document.createElement("button");
    b.type = "button"; b.className = "sense-tab"; b.textContent = T("senseTab")(idx);
    b.setAttribute("aria-pressed", idx === dlg.s ? "true" : "false");
    b.addEventListener("click", function(){ dlg.s = idx; paintWord(); });
    tabs.appendChild(b);
  });
  $("w-pos").textContent = posName(sense.pos);
  $("w-mean").textContent = prefs.lang === "vi" ? sense.vi : sense.en;
  $("w-other").textContent = prefs.lang === "vi" ? sense.en : "";
  $("w-other").hidden = prefs.lang !== "vi";
  $("w-ctx").innerHTML = ctxHTML(p, dlg.s);
  var on = isSaved(idOf(dlg.k, dlg.i, dlg.s));
  var star = $("btn-star");
  star.classList.toggle("on", on);
  star.setAttribute("aria-pressed", on ? "true" : "false");
  var sl = on ? T("unsaveWord") : T("saveWord");
  star.setAttribute("aria-label", sl); star.title = sl;
  $("btn-w-close").textContent = T("close");
}
function toggleStar(){
  var id = idOf(dlg.k, dlg.i, dlg.s), at = saved.indexOf(id);
  if(at > -1) saved.splice(at, 1); else { saved.unshift(id); sfx.star(); }
  save("wt2.saved", saved);
  paintWord();
  if(view === "v-notebook") renderNotebook();
}
function closeWord(){ $("dlg-word").hidden = true; dlg = null; }

/* ---------- notebook ---------- */
function renderNotebook(){
  $("t-home").textContent = T("home");
  $("t-nb-title").textContent = T("nbTitle");
  $("nb-count2").textContent = T("nbCount")(saved.length);
  var body = $("nb-body"); body.innerHTML = "";
  if(!saved.length){
    body.innerHTML = '<div class="empty"><strong>' + T("nbEmptyT") + '</strong>' + T("nbEmptyS") + '</div>';
    return;
  }
  var ul = document.createElement("ul"); ul.className = "nb-list";
  saved.forEach(function(id){
    var a = id.split(":"), k = a[0], i = +a[1], s = +a[2];
    if(!LEVELS[k] || !LEVELS[k].q[i]) return;
    var p = LEVELS[k].q[i], se = p.senses[s];
    var li = document.createElement("li"); li.className = "nb-item";
    li.innerHTML =
      '<div class="nb-word">' + esc(p.answer) + ' <small>' + esc(se.ipa) + '</small> <span class="pos">' + esc(posName(se.pos)) + '</span></div>' +
      '<div class="nb-mean">' + esc(prefs.lang === "vi" ? se.vi : se.en) + '</div>' +
      '<div class="nb-ctx">' + ctxHTML(p, s) + '</div>';
    var rm = document.createElement("button");
    rm.type = "button"; rm.className = "round"; rm.setAttribute("aria-label", T("remove")); rm.title = T("remove");
    rm.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
    rm.addEventListener("click", function(){ saved.splice(saved.indexOf(id), 1); save("wt2.saved", saved); renderNotebook(); });
    li.appendChild(rm);
    ul.appendChild(li);
  });
  body.appendChild(ul);
}

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang = prefs.lang;
  $("btn-lang").textContent = prefs.lang === "vi" ? "EN" : "VI";
  $("btn-lang").setAttribute("aria-label", T("lang")); $("btn-lang").title = T("lang");
  $("r-title").textContent = T("rTitle"); $("r-text").textContent = T("rText");
  $("btn-r-cancel").textContent = T("rCancel"); $("btn-r-ok").textContent = T("rOk");
  applySound(); applyTheme();
  renderHome();
  if(view === "v-play" && st){
    $("play-level").textContent = lvName(st.level);
    $("qno").innerHTML = T("q")(st.i + 1, LEVELS[st.level].q.length);
    $("t-prompt").textContent = T("prompt"); $("t-kbd").innerHTML = T("kbd");
    $("btn-skip").textContent = T("skip"); $("btn-clear").textContent = T("clear");
    if(st.solved){ setStatus(st.hint === 3 ? T("h3") : T("ok")(puzzle().answer), st.hint === 3 ? "hint" : "ok"); }
    else if(st.hint === 1) setStatus(T("h1"), "hint");
    else if(st.hint === 2) setStatus(T("h2"), "hint");
    else setStatus("", "");
    paint(st.solved && st.hint !== 3 ? "ok" : "");
  }
  if(view === "v-done" && st) showDone();
  if(view === "v-notebook") renderNotebook();
  if(dlg) paintWord();
  renderAccount();
}

/* ---------- events ---------- */
function goHome(){ renderHome(); show("v-home"); }
$("btn-home-mark").addEventListener("click", goHome);
$("btn-back").addEventListener("click", goHome);
$("btn-nb-back").addEventListener("click", goHome);
$("btn-other").addEventListener("click", goHome);
$("btn-replay").addEventListener("click", function(){ startLevel(st.level, true); });
$("btn-notebook").addEventListener("click", function(){ renderNotebook(); show("v-notebook"); });
$("btn-hint").addEventListener("click", useHint);
$("btn-del").addEventListener("click", deleteLast);
$("btn-clear").addEventListener("click", clearAll);
$("btn-skip").addEventListener("click", skip);
$("btn-go").addEventListener("click", goPrimary);
$("btn-star").addEventListener("click", toggleStar);
$("btn-w-close").addEventListener("click", closeWord);
$("dlg-word").addEventListener("click", function(e){ if(e.target === this) closeWord(); });
$("btn-reset").addEventListener("click", function(){ $("dlg-reset").hidden = false; $("btn-r-cancel").focus(); });
$("btn-r-cancel").addEventListener("click", function(){ $("dlg-reset").hidden = true; });
$("dlg-reset").addEventListener("click", function(e){ if(e.target === this) this.hidden = true; });
$("btn-r-ok").addEventListener("click", function(){
  progress = { easy:0, medium:0, hard:0 }; save("wt2.progress", progress);
  $("dlg-reset").hidden = true; renderHome();
});
$("btn-acct").addEventListener("click", openAcct);
$("btn-a-out").addEventListener("click", signOut);
$("btn-a-close").addEventListener("click", function(){ $("dlg-acct").hidden = true; });
$("dlg-acct").addEventListener("click", function(e){ if(e.target === this) this.hidden = true; });
$("btn-lang").addEventListener("click", function(){ prefs.lang = prefs.lang === "vi" ? "en" : "vi"; save("wt2.prefs", prefs); applyLang(); });
$("btn-sound").addEventListener("click", function(){ prefs.sound = !prefs.sound; save("wt2.prefs", prefs); applySound(); sfx.tap(); });
$("btn-theme").addEventListener("click", function(){ prefs.theme = isDark() ? "light" : "dark"; save("wt2.prefs", prefs); applyTheme(); });

document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    if(!$("dlg-word").hidden){ closeWord(); return; }
    if(!$("dlg-reset").hidden){ $("dlg-reset").hidden = true; return; }
    if(!$("dlg-acct").hidden){ $("dlg-acct").hidden = true; return; }
  }
  if(view !== "v-play" || !st || dlg || !$("dlg-reset").hidden) return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(/^[a-zA-Z]$/.test(e.key)){ e.preventDefault(); typeLetter(e.key.toUpperCase()); }
  else if(e.key === "Backspace"){ e.preventDefault(); deleteLast(); }
  else if(e.key === "Enter"){
    if(document.activeElement && document.activeElement.tagName === "BUTTON" && document.activeElement !== $("btn-go")) return;
    e.preventDefault(); goPrimary();
  }
});

/* ---------- boot ---------- */
applyLang();
show("v-home");
initCloud();
})();
</script>
